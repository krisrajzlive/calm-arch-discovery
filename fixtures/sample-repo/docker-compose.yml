# Local development stack. Production runs on Kubernetes (see k8s/).
services:
  orders-api:
    build:
      context: ./services/orders-api
    ports:
      - "8080:8080"
    environment:
      ORDERS_DB_URL: postgresql://orders_app:${ORDERS_DB_PASSWORD:-local}@orders-db:5432/orders
      CACHE_URL: redis://cache:6379/0
      PAYMENTS_URL: http://payments-service:8080
    depends_on:
      - orders-db
      - cache
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  payments-service:
    build:
      context: ./services/payments-service
    ports:
      - "8081:8080"
    environment:
      NOTIFICATION_URL: http://notification-worker:9000/events
    networks: [backend]

  notification-worker:
    build:
      context: ./services/notification-worker
    environment:
      ORDERS_API_URL: http://orders-api:8080/callbacks
      SMTP_URL: smtp://mail-relay:1025
    depends_on:
      - mail-relay
    networks: [backend]

  storefront-web:
    build:
      context: ./services/storefront-web
    ports:
      - "3000:8080"
    environment:
      ORDERS_API_URL: http://orders-api:8080
    networks: [backend]

  orders-db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: orders_app
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-local}
    networks: [backend]

  cache:
    image: redis:7.4
    networks: [backend]

  mail-relay:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
    networks: [backend]

networks:
  backend: {}
