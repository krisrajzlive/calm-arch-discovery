name: security-gate

# Security as code: every check below is a job that fails the build. The final `security-gate`
# job aggregates them and is the single status to require in branch protection.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  SEMGREP_VERSION: "1.186.0"
  TRIVY_VERSION: "v0.76.2"
  CALM_CLI_VERSION: "1.74.0"

jobs:
  # --------------------------------------------------------------------------- SAST
  sast-semgrep:
    name: SAST - Semgrep (fail on ERROR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: Semgrep (registry rulesets + project rules in .semgrep/)
        run: |
          semgrep scan \
            --config p/python --config p/owasp-top-ten --config .semgrep/ \
            --severity ERROR --error --metrics off \
            --exclude tests/negative-controls \
            scanner graph pipeline intent tests

  # --------------------------------------------------------------------------- SCA
  sca-trivy:
    name: SCA - Trivy on requirements.txt (fail on HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: requirements.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

  # --------------------------------------------------------------------------- CALM gate
  calm-gate:
    name: CALM - architecture gate (every node needs controls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pip install -r requirements.txt && pip install --no-deps -e .

      - name: Compile the architecture document (Markdown) into the intended CALM
        run: calm-intent fixtures/sample-repo/docs/architecture/architecture.md --format github -o build/payments-platform.intended.calm.json

      - name: Rediscover the architecture from the code into the actual CALM
        run: |
          calm-discover fixtures/sample-repo -o build/payments-platform.actual.calm.json
          calm-export-gremlin build/payments-platform.actual.calm.json -o build/payments-platform.groovy

      - name: Drift check - committed artifacts must match their sources
        run: |
          stale=0
          for f in payments-platform.actual.calm.json payments-platform.intended.calm.json payments-platform.groovy; do
            diff -u "architecture/$f" "build/$f" || { echo "::error::architecture/$f is stale; regenerate it (see README)"; stale=1; }
          done
          exit $stale

      - name: CALM gate on both documents (schema + references + control requirements + controls on every node)
        run: |
          calm-gate build/payments-platform.actual.calm.json build/payments-platform.intended.calm.json \
            architecture/payments-platform.actual.calm.json architecture/payments-platform.intended.calm.json --format github

      - name: Conformance gate - the code must do what the architecture document says
        run: |
          calm-conformance --actual build/payments-platform.actual.calm.json \
            --intended build/payments-platform.intended.calm.json --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          calm-conformance --actual build/payments-platform.actual.calm.json \
            --intended build/payments-platform.intended.calm.json --format github

      - name: Independent check with the official FINOS calm-cli
        run: |
          for f in actual intended; do
            npx --yes "@finos/calm-cli@${CALM_CLI_VERSION}" validate \
              -a "architecture/payments-platform.$f.calm.json" \
              -u calm-url-mapping.json --strict -f pretty
          done

  # --------------------------------------------------------------------------- tests
  test:
    name: Lint, unit and Neo4j integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"
      - name: Start Neo4j with a throwaway password
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "NEO4J_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name neo4j -p 127.0.0.1:7687:7687 -e NEO4J_AUTH="neo4j/$pw" neo4j:5.26-community
          for _ in $(seq 1 40); do
            docker exec neo4j cypher-shell -u neo4j -p "$pw" 'RETURN 1' >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker logs neo4j; exit 1
      - name: Integration tests (loader + Cypher queries against real Neo4j)
        env:
          REQUIRE_INTEGRATION: "1"
        run: pytest -m integration tests/integration/test_neo4j.py

  # --------------------------------------------------------------------------- negative controls
  gate-self-test:
    name: Negative controls - each gate must block known-bad input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - run: pipx install "semgrep==${SEMGREP_VERSION}"

      - name: SAST gate must reject insecure code
        run: |
          if semgrep scan --config p/python --config .semgrep/ --severity ERROR --error \
               --metrics off tests/negative-controls; then
            echo "::error::SAST gate passed on code it must reject"; exit 1
          fi

      - name: SCA gate must reject known-vulnerable pins
        id: sca-negative
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: tests/negative-controls/requirements.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}
      - name: Assert the SCA gate blocked
        if: steps.sca-negative.outcome != 'failure'
        run: echo "::error::SCA gate passed on vulnerable dependencies"; exit 1

      - name: CALM gate must reject a node without controls
        run: |
          if calm-gate tests/data/node-without-controls.calm.json; then
            echo "::error::CALM gate passed a node with no controls"; exit 1
          fi

      - name: Conformance gate must reject code that drifted from the architecture document
        run: |
          calm-intent tests/data/architecture-drifted.md -o build/drifted.intended.calm.json
          if calm-conformance --actual architecture/payments-platform.actual.calm.json \
               --intended build/drifted.intended.calm.json; then
            echo "::error::conformance gate passed code that drifted from the document"; exit 1
          fi

      - name: Conformance gate must reject expired waivers
        run: |
          if calm-conformance --actual architecture/payments-platform.actual.calm.json \
               --intended architecture/payments-platform.intended.calm.json --today 2031-01-01; then
            echo "::error::conformance gate honoured expired waivers"; exit 1
          fi

      - name: Markdown compiler must reject a malformed architecture document
        run: |
          mkdir -p build
          sed 's/| ingress |/| ingres |/' fixtures/sample-repo/docs/architecture/architecture.md > build/malformed.md
          if calm-intent build/malformed.md; then
            echo "::error::malformed architecture document compiled"; exit 1
          fi

  # --------------------------------------------------------------------------- aggregate
  security-gate:
    name: security-gate
    if: always()
    needs: [sast-semgrep, sca-trivy, calm-gate, test, gate-self-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::at least one gate did not pass"; exit 1; }
          done
